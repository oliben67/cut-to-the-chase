# Run on the Docker-enabled host. Clients then connect via an SSH tunnel
# to 127.0.0.1:8765 on *this* host -- nothing here needs to be exposed to
# the network; see docs/architecture/remote-server.md.
services:
  cttc-gateway:
    build: .
    image: cttc-gateway:latest
    restart: unless-stopped
    # Redis's own graceful-shutdown RDB save (see redis_log.py's start())
    # needs real time to complete under real data volumes -- Docker's
    # default (10s) is tighter than ideal headroom over the ~256MB
    # maxmemory cap's worst-case save time; see redis_log.py's stop() for
    # the matching internal 15s backstop this is sized to exceed.
    stop_grace_period: 30s
    # both required for accurate host telemetry (HostStatsSource uses
    # psutil, which without these only sees this container's own cgroup/
    # network-namespace view, not the physical host's):
    pid: host
    network_mode: host
    environment:
      - SSH_AUTH_SOCK=/ssh-agent
      # Shared-secret required (as the X-CTTC-Token header) on every HTTP
      # request once set (br-NET-004) -- this container binds 0.0.0.0 with
      # network_mode: host above, so without it anything that can reach
      # this host at all has full unauthenticated API access. Passed
      # through from the invoking shell's env, generated/persisted by
      # main.js's lib/api-token.js at provision time.
      - CTTC_API_TOKEN
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Lets `docker -H ssh://...` (Set Sources with an ssh:// host) reach a
      # *third* machine, authenticating as whatever key this host's own
      # ssh-agent already has loaded -- no key ever lives in the container.
      # Falls back to /dev/null (a harmless no-op mount) when this host has
      # no SSH_AUTH_SOCK exported, e.g. no agent running: see
      # docs/architecture/remote-server.md.
      - ${SSH_AUTH_SOCK:-/dev/null}:/ssh-agent
      # The same private key the client used to reach this host, copied
      # here by server-provision.js's ensureRemoteContainer at deploy time
      # -- ssh's own default identity location, so it's tried automatically
      # by every outbound ssh call this container makes (the one above,
      # HostStatsSource), no per-host ssh_config needed. Falls back to
      # /dev/null (no-op) when the gateway was reached via agent/no explicit
      # key -- see docs/architecture/remote-server.md.
      - ${CTTC_ID_RSA:-/dev/null}:/root/.ssh/id_rsa:ro
      # Redis's RDB/AOF persistence (see redis_log.py) -- MUST be host-
      # mounted, not left on the container's writable layer, or a container
      # recreation (image update, `docker compose down && up`, `docker rm`)
      # silently loses it. Defaults to a directory beside this compose file;
      # override with CTTC_REDIS_DATA_DIR for a real deploy that wants this
      # on a specific disk/mount, same pattern as CTTC_ID_RSA above.
      # Container-side path matches RedisLog's own Path(__file__).parent-
      # relative default (/srv/cttc-gateway/redis-data) exactly, so no
      # --redis-data-dir flag is needed in the image's own ENTRYPOINT.
      - ${CTTC_REDIS_DATA_DIR:-./redis-data}:/srv/cttc-gateway/redis-data
