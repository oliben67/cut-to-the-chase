<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Edit Gateways</title>
  <link rel="stylesheet" href="gateway-setup.css" />
</head>
<body>
  <main id="gateway-setup">
    <h1>Edit Gateways</h1>
    <p class="muted">
      Choose a gateway to change its connection settings, or uninstall it.
    </p>

    <label>Gateway
      <select id="gateway-select"></select>
    </label>

    <div id="empty" class="muted" hidden>
      No gateways recorded yet — use File &gt; Gateways &gt; New Gateway to add one.
    </div>

    <form id="form">
      <label>SSH username
        <input id="ssh-user" type="text" required autocomplete="off" />
      </label>
      <label>Remote SSH host
        <input id="ssh-host" type="text" required autocomplete="off" placeholder="docker-host.example.com" />
      </label>
      <label>SSH port
        <input id="ssh-port" type="number" min="1" max="65535" value="22" required />
      </label>

      <fieldset>
        <legend>SSH private key</legend>
        <label class="radio-row"><input type="radio" name="key-mode" value="path" checked /> Use a key file already on this machine</label>

        <div id="key-path-row">
          <input id="key-path" type="text" readonly placeholder="No file selected" />
          <button type="button" id="btn-browse">Browse…</button>
        </div>

        <label class="radio-row"><input type="radio" name="key-mode" value="paste" /> Paste the key's contents</label>
        <textarea id="key-paste" rows="6" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----" disabled></textarea>
      </fieldset>

      <div id="error" class="error" hidden></div>

      <div class="actions">
        <button type="button" id="btn-uninstall" class="secondary" title="Stop and remove this gateway's container">Uninstall…</button>
        <button type="submit" id="btn-save">Save changes</button>
      </div>
    </form>

    <div id="wait" class="wait" hidden>
      <div class="spinner"></div>
      <p id="wait-msg">Applying changes, please wait…</p>
    </div>

    <div id="activity" hidden>
      <button type="button" id="btn-activity-toggle" class="linklike">Show activity</button>
      <pre id="activity-log" class="activity-log" hidden></pre>
    </div>
  </main>
  <script src="gateway-manage.js"></script>
</body>
</html>
